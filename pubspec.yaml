name: why_not_useless_olympics
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  provider: ^6.1.5+1
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.13.0
  permission_handler: ^11.3.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/cat_sticker.jpg
    - assets/images/logo.jpg
    - assets/audio/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpg"
